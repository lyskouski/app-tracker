name: Project Release Artifacts

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    uses: ./.github/workflows/create_release_page.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      draft: false

  build:
    name: Create ${{ matrix.target }} build
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        target: [Web, Android]
        include:
          - os: ubuntu-latest
            target: Web
            build_path: webApp/build/dist/wasmJs/productionExecutable/
            asset_extension: .tar.gz
            asset_content_type: application/gzip
          - os: ubuntu-latest
            target: Android
            build_path: androidApp/build/outputs/bundle/release/
            asset_extension: .aab
            asset_content_type: application/zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

# Web
      - name: Build Web (Kotlin/Wasm) distribution
        if: matrix.target == 'Web'
        run: ./gradlew :webApp:wasmJsBrowserDistribution --no-daemon

      - name: Compress Web Package
        if: matrix.target == 'Web'
        run: tar czf zwyka_${{ matrix.target }}${{ matrix.asset_extension }} *
        working-directory: ${{ matrix.build_path }}

# Android
      - name: Apply Android Keychain
        if: matrix.target == 'Android'
        env:
          ANDROID_JKS: ${{ secrets.ANDROID_JKS }}
          ANDROID_KEY: ${{ secrets.ANDROID_KEY }}
        run: |
          echo -n "$ANDROID_JKS" | base64 -d > $GITHUB_WORKSPACE/androidApp/key.jks
          echo -n "$ANDROID_KEY" | base64 -d > $GITHUB_WORKSPACE/androidApp/key.properties

      - name: Run Android Build
        if: matrix.target == 'Android'
        run: |
          ./gradlew :androidApp:bundleRelease --no-daemon \
            -PversionCode=${{ needs.release.outputs.build_number }} \
            -PversionName=${{ needs.release.outputs.version }}

      - name: Rename Android Bundle
        if: matrix.target == 'Android'
        run: mv androidApp-release.aab zwyka_${{ matrix.target }}${{ matrix.asset_extension }}
        working-directory: ${{ matrix.build_path }}

#
      - name: Upload ${{ matrix.target }} Artifact
        id: upload_release_asset
        uses: actions/upload-release-asset@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: ${{ matrix.build_path }}zwyka_${{ matrix.target }}${{ matrix.asset_extension }}
          asset_name: zwyka_${{ matrix.target }}${{ matrix.asset_extension }}
          asset_content_type: ${{ matrix.asset_content_type }}

# Linux: Compose distributable with a bundled JRE, repacked below into Snap, AppImage and Flatpak.
  build-linux:
    name: Create Linux build
    permissions:
      contents: write
    # The oldest supported Ubuntu for a better glibc compatibility.
    runs-on: ubuntu-22.04
    needs: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Linux Build
        run: |
          ./gradlew :desktopApp:createDistributable --no-daemon \
            -PversionName=${{ needs.release.outputs.version }}

      - name: Compress Linux Package
        run: |
          cp $GITHUB_WORKSPACE/com.tercad.zwyka.desktop ./
          cp $GITHUB_WORKSPACE/com.tercad.zwyka.svg ./
          tar czf $GITHUB_WORKSPACE/zwyka_Linux.tar.gz *
        working-directory: desktopApp/build/compose/binaries/main/app/zwyka

      - name: Add Linux Artifact to Build
        uses: actions/upload-artifact@v4
        with:
          name: zwyka_Linux
          path: zwyka_Linux.tar.gz

      - name: Upload Linux Artifact
        uses: actions/upload-release-asset@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: zwyka_Linux.tar.gz
          asset_name: zwyka_Linux.tar.gz
          asset_content_type: application/gzip

# Linux Snap
  build-snap:
    name: Create Linux Snap build
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    needs: [release, build-linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: zwyka_Linux

      - name: Build Snap
        run: |
          sed -i "s/^version: .*/version: '${{ needs.release.outputs.version }}'/" snapcraft.yaml
          sudo snap install snapcraft --classic
          sudo snapcraft pack --destructive-mode --verbose
          # Packed by root: hand it over to the runner user.
          sudo chown "$(id -u):$(id -g)" zwyka_*.snap
          mv zwyka_*.snap zwyka_LinuxSnap.snap
          ls -la zwyka_LinuxSnap.snap

      # --clobber: a re-run replaces the already uploaded asset.
      - name: Upload Snap Artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" zwyka_LinuxSnap.snap --clobber

      # Requires the registered "zwyka" name and `snapcraft export-login` credentials.
      - name: Publish Snap
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_CREDENTIALS }}
        run: |
          sudo --preserve-env=SNAPCRAFT_STORE_CREDENTIALS snapcraft upload zwyka_LinuxSnap.snap --release=latest/stable

# Linux AppImage
  build-appimage:
    name: Create Linux AppImage build
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    needs: [release, build-linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: zwyka_Linux
          path: linux-appimage

      - name: Build Linux AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2
          sh build.sh -v "${{ needs.release.outputs.version }}"
        working-directory: linux-appimage

      - name: Upload AppImage Artifact
        uses: actions/upload-release-asset@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: linux-appimage/Zwyka-${{ needs.release.outputs.version }}-x86_64.AppImage
          asset_name: Zwyka-${{ needs.release.outputs.version }}-x86_64.AppImage
          asset_content_type: application/vnd.appimage

# Linux Flatpak
  build-flatpak:
    name: Create Linux Flatpak build
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    needs: [release, build-linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: zwyka_Linux

      - name: Patch Manifest
        run: |
          sh patch.sh -v "${{ needs.release.outputs.version }}" \
            -s $(sha256sum $GITHUB_WORKSPACE/zwyka_Linux.tar.gz | gawk '{ print $1 }')
        working-directory: linux-flatpak

      - name: Build Linux Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak appstream-util
          appstream-util validate-relax com.tercad.zwyka.metainfo.xml
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          # flatpak-builder of Ubuntu calls appstream-compose, which is gone from the newer SDKs:
          # the builder of Flathub (org.flatpak.Builder) uses appstreamcli instead.
          flatpak install --user -y flathub org.flatpak.Builder org.gnome.Platform//51 org.gnome.Sdk//51
          flatpak run org.flatpak.Builder --user --install --force-clean build-dir com.tercad.zwyka.yml
          flatpak build-bundle ~/.local/share/flatpak/repo zwyka_LinuxFlatpak.flatpak com.tercad.zwyka
        working-directory: linux-flatpak

      - name: Store Configs for github.com/flathub
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-configs
          path: |
            linux-flatpak/com.tercad.zwyka.metainfo.xml
            linux-flatpak/com.tercad.zwyka.yml

      - name: Upload Flatpak Artifact
        uses: actions/upload-release-asset@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: linux-flatpak/zwyka_LinuxFlatpak.flatpak
          asset_name: zwyka_LinuxFlatpak.flatpak
          asset_content_type: application/vnd.flatpak
