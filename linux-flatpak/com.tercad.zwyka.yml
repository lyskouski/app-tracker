app-id: com.tercad.zwyka
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk17
command: zwyka
separate-locales: false
finish-args:
  # Java AWT renders through X11 only (XWayland on Wayland sessions).
  - --socket=x11
  - --share=ipc
  - --device=dri
  # Import / Export of data via the file dialog.
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  # Tray icon and reminders.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: zwyka
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/openjdk17/bin
      env:
        JAVA_HOME: /usr/lib/sdk/openjdk17/jvm/openjdk-17
        GRADLE_USER_HOME: /run/build/zwyka/.gradle
    build-commands:
      - gradle-dist/bin/gradle --offline --no-daemon --init-script linux-flatpak/offline-repository.init.gradle.kts
        -Pkotlin.incremental=false :desktopApp:createDistributable -PversionName={VERSION}
      - cp -a desktopApp/build/compose/binaries/main/app/zwyka/bin desktopApp/build/compose/binaries/main/app/zwyka/lib /app/
      - install -Dm644 com.tercad.zwyka.svg /app/share/icons/hicolor/scalable/apps/com.tercad.zwyka.svg
      - install -Dm644 com.tercad.zwyka.desktop /app/share/applications/com.tercad.zwyka.desktop
      - install -Dm644 com.tercad.zwyka.metainfo.xml /app/share/metainfo/com.tercad.zwyka.metainfo.xml
    sources:
      - type: git
        url: https://github.com/lyskouski/app-tracker.git
        tag: v{VERSION}
        commit: "{COMMIT}"
      - type: archive
        url: https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
        sha256: b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06
        dest: gradle-dist
      - gradle-sources-root.json
      - gradle-sources-shared.json
      - gradle-sources-desktopApp.json
